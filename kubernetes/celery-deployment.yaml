apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker-ai
  namespace: default
  labels:
    app: celery-worker-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker-ai
  template:
    metadata:
      labels:
        app: celery-worker-ai
    spec:
      containers:
        - name: celery-worker-ai
          image: ai-job-backend:latest
          command: ["celery", "-A", "app.core.celery_app", "worker", "-Q", "ai_tasks", "--loglevel=info", "--concurrency=2"]
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://postgres:postgres@postgres:5432/ai_job"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            limits:
              cpu: "1.5"
              memory: 1.5Gi
            requests:
              cpu: 750m
              memory: 768Mi
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.core.celery_app
                - inspect
                - ping
                - -d
                - celery@%h
            initialDelaySeconds: 15
            periodSeconds: 20
---
